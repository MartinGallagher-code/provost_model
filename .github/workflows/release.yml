# Publish provost-model to PyPI via Trusted Publishing (OIDC — no API token).
# One-time setup on https://pypi.org/manage/account/publishing/ (a "pending
# publisher" until the first upload creates the project):
#   PyPI project name: provost-model, owner: MartinGallagher-code,
#   repository name: provost_model, workflow name: release.yml,
#   environment name: pypi
# Then publishing a GitHub release (or dispatching this workflow) uploads the
# sdist + wheel built from the tagged commit. Bump __version__ in
# src/provost_model/__init__.py first: PyPI never accepts a version twice.
name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # PyPI refuses a file over 100 MB unless the project's limit is raised
      - name: every file is under PyPI's 100 MB limit
        run: |
          for f in dist/*; do
            s=$(stat -c %s "$f"); echo "$f: $s bytes"
            [ "$s" -lt 100000000 ] || { echo "$f is over 100 MB"; exit 1; }
          done
      - name: install the wheel and test what it ships
        run: |
          python -m pip install dist/*.whl
          cd tests && python -m unittest discover -s . -v
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
