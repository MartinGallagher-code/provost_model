name: CI

on:
  push:
  pull_request:

jobs:
  package:
    name: build, check and install the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: build sdist + wheel
        run: python -m build
      - run: python -m twine check dist/*
      # PyPI refuses a file over 100 MB unless the project's limit is raised
      - name: every file is under PyPI's 100 MB limit
        run: |
          for f in dist/*; do
            s=$(stat -c %s "$f"); echo "$f: $s bytes"
            [ "$s" -lt 100000000 ] || { echo "$f is over 100 MB"; exit 1; }
          done
      - name: install the wheel and test what it ships
        run: |
          python -m pip install dist/*.whl
          cd tests && python -m unittest discover -s . -v
      # provost hides a broken model (load_lm() returns None and the trees
      # label), so load and run it with provost's own runtime: tests/smoke_provost.py
      - name: provost from PyPI loads and runs the packaged model
        run: |
          python -m pip install provost
          python -c "import importlib.metadata as m; print('provost', m.version('provost'))"
          cd tests && python -m unittest -v smoke_provost

  # Every change moves the version (shared_tools BN-002): tests/check_version.sh
  # holds __version__ and CHANGELOG.md together, and the version must be greater
  # than the base branch's on a pull request, and than main's before a push to it.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD
