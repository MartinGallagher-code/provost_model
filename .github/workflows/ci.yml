name: CI

on:
  push:
  pull_request:

jobs:
  package:
    name: build, check and install the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: build sdist + wheel
        run: python -m build
      - run: python -m twine check dist/*
      # PyPI refuses a file over 100 MB unless the project's limit is raised
      - name: every file is under PyPI's 100 MB limit
        run: |
          for f in dist/*; do
            s=$(stat -c %s "$f"); echo "$f: $s bytes"
            [ "$s" -lt 100000000 ] || { echo "$f is over 100 MB"; exit 1; }
          done
      - name: install the wheel and test what it ships
        run: |
          python -m pip install dist/*.whl
          cd tests && python -m unittest discover -s . -v
