[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provost-model"
dynamic = ["version"]
description = "The tiny-LM layout labeller for provost --model: SmolLM2-135M fine-tuned on provost's labels, 18 layers, 8-bit, run with numpy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.8"
authors = [{ name = "Martin J. Gallagher" }]
maintainers = [{ name = "Martin J. Gallagher" }]
keywords = ["provost", "layout", "tabular", "command-output", "language-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
# provost runs the model; it needs numpy, and provost itself is installed
# beside this (pip install provost[lm] installs both).
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/provost_model"
Source = "https://github.com/MartinGallagher-code/provost_model"
provost = "https://github.com/MartinGallagher-code/provost"

[tool.hatch.version]
path = "src/provost_model/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/provost_model"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml"]
